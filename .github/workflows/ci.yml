name: CI

on:
  pull_request:
  # Deliberately no `push: branches: [main]`. release.yml runs on that push and
  # gates itself on this workflow via workflow_call, so keeping a push trigger
  # here would run the whole suite twice for every merge.
  workflow_call:

permissions:
  contents: read

env:
  PYTHON_VERSION: '3.12'
  # Defaults so a future flip of core.settings' fallbacks can't silently break
  # CI: DEBUG=False + empty SECRET_KEY raises ImproperlyConfigured on import.
  SECRET_KEY: ci-placeholder-secret-key-not-used-in-production
  DEBUG: 'True'

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - run: ruff check --output-format=github .
      - run: ruff format --check .

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: requirements-dev.txt
      # psycopg2==2.9.10 builds from source; needs libpq headers. ffmpeg is not
      # on the runner image, and without it the HLS end-to-end tests skip
      # silently -- which is worse than not having them, since they are the only
      # thing guarding the on-disk layout the streaming views and Caddy depend on.
      - run: sudo apt-get update && sudo apt-get install -y libpq-dev ffmpeg
      - run: pip install -r requirements-dev.txt
      # The e2e tests skip themselves when ffmpeg is absent, so a failed install
      # would quietly reduce the suite instead of failing. Check it explicitly.
      - name: Require ffmpeg (the HLS end-to-end tests skip without it)
        run: ffmpeg -version | head -1 && ffprobe -version | head -1
      - run: pytest --cov --cov-report=term-missing --cov-report=xml
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: coverage-xml
          path: coverage.xml

  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: requirements-dev.txt
      # psycopg2==2.9.10 builds from source; needs libpq headers.
      - run: sudo apt-get update && sudo apt-get install -y libpq-dev
      - run: pip install -r requirements-dev.txt
      - run: mypy .

  migrations:
    runs-on: ubuntu-latest
    env:
      DJANGO_SETTINGS_MODULE: core.settings_test
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: sudo apt-get update && sudo apt-get install -y libpq-dev
      - run: pip install -r requirements-dev.txt
      - run: python manage.py makemigrations --check --dry-run

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      # Config (including which dirs are skipped) lives in pyproject.toml so it
      # is the same locally and here.
      - name: bandit
        run: bandit -c pyproject.toml -r . -ll
      - name: gitleaks
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      # Pinned like every other dependency in this repo: an unpinned scanner
      # turns a green pipeline red on someone else's release schedule.
      - name: semgrep
        run: |
          pip install semgrep==1.172.0
          semgrep --config p/python --config p/django --config p/secrets --error .

  caddy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Validate Caddyfile
        run: |
          docker run --rm \
            -e SITE_ADDRESS=example.com \
            -v "${{ github.workspace }}/caddy/Caddyfile:/etc/caddy/Caddyfile:ro" \
            caddy:2 caddy validate --config /etc/caddy/Caddyfile --adapter caddyfile

      # `validate` only proves the file parses. The two properties the HLS
      # offload actually depends on are invisible in the Caddyfile source
      # because the adapter REORDERS directives, so they are asserted against
      # the generated JSON — the thing Caddy really runs.
      - name: Adapt Caddyfile to JSON
        run: |
          docker run --rm \
            -e SITE_ADDRESS=example.com \
            -v "${{ github.workspace }}/caddy/Caddyfile:/etc/caddy/Caddyfile:ro" \
            caddy:2 caddy adapt --config /etc/caddy/Caddyfile --adapter caddyfile \
            2>/dev/null > adapted.json

      # @backend matches /api/*, which covers every HLS URL. `handle` sorts
      # BEFORE `route` in the adapter's directive order, so a top-level
      # `route @hls` written above @backend is emitted below it: the API proxy
      # wins, every segment goes back through Gunicorn, and nothing anywhere
      # reports an error. Only the adapted output shows it.
      - name: The HLS route must be ordered before the API proxy
        run: |
          jq -e '
            def has_match(f):
              (.match? | type) == "array"
              and any(.match[]; (type == "object") and f);
            def hls_at: map(has_match(.path_regexp?.name? == "hls")) | index(true);
            def api_at: map(has_match((.path? // []) | any(. == "/api/*"))) | index(true);
            [ .. | objects | select(has("routes")) | .routes
              | select((hls_at != null) and (api_at != null))
              | (hls_at < api_at) ]
            | (length > 0) and all
          ' adapted.json

      # Inside a handle block the adapter sorts `uri` before `forward_auth`.
      # Drop the inner `route` and the auth subrequest starts reporting the
      # rewritten path in X-Forwarded-Uri — an entitlement check in Django
      # would then authorize a path the client never asked for.
      - name: forward_auth must run before the path rewrite
        run: |
          jq -e '
            def is_hls:
              (.match? | type) == "array"
              and any(.match[]; (type == "object") and (.path_regexp?.name? == "hls"));
            def chain: [ .. | objects | select(has("handler"))
              | .handler + ":" + ((.rewrite?.uri? // .strip_path_prefix? // "") | tostring) ];
            [ .. | objects | select(is_hls) | chain
              | (index("reverse_proxy:/internal/hls-auth/")) as $auth
              | (index("rewrite:/api/video")) as $strip
              | ($auth != null) and ($strip != null) and ($auth < $strip) ]
            | (length > 0) and all
          ' adapted.json

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v7
        with:
          context: .
          file: backend.Dockerfile
          push: false
          load: true
          tags: videoflix-backend:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Django deploy check
        run: |
          docker run --rm --entrypoint python \
            -e SECRET_KEY=ci-deploy-check-secret-key-not-used-in-production \
            -e DEBUG=False \
            -e ALLOWED_HOSTS=localhost \
            videoflix-backend:ci manage.py check --deploy --fail-level ERROR

  ci-ok:
    runs-on: ubuntu-latest
    if: always()
    needs: [lint, test, typecheck, migrations, security, caddy, docker]
    steps:
      - name: Require all jobs to have succeeded
        run: |
          if [ "${{ contains(needs.*.result, 'failure') }}" = "true" ] || \
             [ "${{ contains(needs.*.result, 'cancelled') }}" = "true" ]; then
            echo "One or more required jobs did not succeed."
            exit 1
          fi
          echo "All required jobs passed."
