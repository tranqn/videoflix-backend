services:

  db:
    # Pinned to match compose.prod.yml: postgres:latest would eventually pull
    # a new major version and refuse to start against the existing data
    # directory (major upgrades need an explicit migration step).
    image: postgres:17-alpine
    container_name: videoflix_database
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql

  redis:
    # Pinned to match compose.prod.yml, for the same reason as postgres above.
    image: redis:7-alpine
    container_name: videoflix_redis
    volumes:
      - redis_data:/data

  web:
    build:
      context: .
      dockerfile: backend.Dockerfile
    env_file: .env
    container_name: videoflix_backend

    volumes:
      - .:/app
      - videoflix_media:/app/media
    ports:
      - "8000:8000"
    environment:
      - PYTHONUNBUFFERED=1
    depends_on:
      - db
      - redis

volumes:
  postgres_data:
  redis_data:
  videoflix_media:
