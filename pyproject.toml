[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["*/migrations/*"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "D"]
ignore = ["D106"]

[tool.ruff.lint.pydocstyle]
convention = "pep257"

[tool.ruff.lint.isort]
known-first-party = ["auth_app", "video_app", "core"]

[tool.ruff.lint.per-file-ignores]
"*/tests/*" = ["D"]
"*/__init__.py" = ["D104"]
"manage.py" = ["D"]
"core/settings*.py" = ["F403", "F405"]

[tool.ruff.format]
quote-style = "single"

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "core.settings_test"
python_files = ["test_*.py"]
testpaths = ["auth_app", "video_app", "core"]
addopts = "-q --strict-markers"
markers = [
    "ffmpeg: real end-to-end test that shells out to ffmpeg/ffprobe (deselect with -m 'not ffmpeg' where they are not on PATH)",
]

[tool.coverage.run]
source = ["auth_app", "video_app", "core"]
omit = [
    "*/migrations/*",
    "*/tests/*",
    "*/wsgi.py",
    "*/asgi.py",
    "manage.py",
]

[tool.coverage.report]
show_missing = true
skip_covered = true
fail_under = 93

[tool.mypy]
python_version = "3.12"
plugins = ["mypy_django_plugin.main"]
exclude = ["migrations/", "tests/"]
# Retrofitting an untyped codebase: start lenient, catch real errors (wrong
# attribute, bad return) rather than chasing full annotation coverage.
ignore_missing_imports = true
check_untyped_defs = true

[tool.django-stubs]
django_settings_module = "core.settings_test"

[tool.bandit]
# Scan the whole tree rather than naming apps, so a new app is covered the day
# it is created. Tests are excluded because they trip B101 (assert_used) by
# design; migrations are generated code we do not hand-audit.
exclude_dirs = [".venv", "./.venv", "./media", "./static", "./video_app/migrations", "./auth_app/tests", "./video_app/tests"]
