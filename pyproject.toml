[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["*/migrations/*"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "D"]
ignore = ["D106"]

[tool.ruff.lint.pydocstyle]
convention = "pep257"

[tool.ruff.lint.isort]
known-first-party = ["auth_app", "video_app", "core"]

[tool.ruff.lint.per-file-ignores]
"*/tests/*" = ["D"]
"*/__init__.py" = ["D104"]
"manage.py" = ["D"]
"core/settings*.py" = ["F403", "F405"]

[tool.ruff.format]
quote-style = "single"

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "core.settings_test"
python_files = ["test_*.py"]
testpaths = ["auth_app", "video_app"]
addopts = "-q --strict-markers"

[tool.coverage.run]
source = ["auth_app", "video_app", "core"]
omit = [
    "*/migrations/*",
    "*/tests/*",
    "*/wsgi.py",
    "*/asgi.py",
    "manage.py",
]

[tool.coverage.report]
show_missing = true
skip_covered = true
fail_under = 93
