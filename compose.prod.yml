# Production stack for the Videoflix backend + its (forked) frontend.
#
# Caddy (automatic HTTPS) serves the static frontend and reverse-proxies the API
# to Gunicorn — all behind ONE origin, so the HttpOnly JWT cookies are
# first-party. Heavy HLS transcoding runs in a dedicated `worker` service so a
# long FFmpeg job never blocks web requests.
#
#   git clone <backend>          # this repo
#   git clone <frontend> ../frontend   # the forked Vanilla-JS frontend, as a sibling
#   cp .env.template .env        # set SECRET_KEY, DEBUG=False, hosts, DB_*, SITE_ADDRESS, EMAIL_*
#   WEB_IMAGE=ghcr.io/tranqn/videoflix-backend:<sha> docker compose -f compose.prod.yml up -d
#
# App:   https://<SITE_ADDRESS>/
# Admin: https://<SITE_ADDRESS>/admin/
#
# NO `build:` IN THIS FILE — ON PURPOSE.
# The application image is built once by CI (.github/workflows/release.yml) and
# pushed to ghcr.io/tranqn/videoflix-backend:<full-commit-sha>. The server only
# ever pulls. Because nothing here can build, a missing/typo'd image is a hard
# error at `up` time instead of a silent rebuild from whatever source tree
# happens to be on the box — the deployed artifact is then exactly the one CI
# tested. To build locally, add the overlay that restores the build context:
#
#   docker compose -f compose.prod.yml -f compose.build.yml build
#
# WEB_IMAGE is the single knob that selects the version of the app. deploy.sh
# passes the immutable :<sha> tag; the `videoflix-backend:prod` default only
# exists so a locally built image still runs without extra env.
#
# The GHCR package is public, so the server needs no registry credentials at
# all — one less long-lived secret on a publicly reachable box.
#
# The dev docker-compose.yml stays the local-development path and is untouched.

services:
  caddy:
    image: caddy:2.11
    container_name: videoflix_caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"            # HTTP/3
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:?set SITE_ADDRESS to your domain/sslip.io host in .env}
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - ../frontend:/srv/frontend:ro   # the forked frontend, cloned as a sibling
      # HLS offload: Caddy serves playlists/segments off the media volume
      # instead of parking a Gunicorn worker on every 6-second segment. Django
      # still authorizes each request (forward_auth -> /internal/hls-auth/).
      #
      # :ro is not decoration. Caddy is the process exposed to the internet;
      # the workers' transcode output is the thing it reads. Read-only means a
      # Caddy compromise cannot rewrite a segment other users then play.
      #
      # Mounted at /srv/media, but the Caddyfile roots at /srv/media/hls — the
      # raw uploads in /srv/media/uploads stay outside any document root.
      - videoflix_media:/srv/media:ro
      - caddy_data:/data              # certificates (persist across restarts)
      - caddy_config:/config
    depends_on:
      - web

  db:
    image: postgres:17-alpine
    container_name: videoflix_database
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: videoflix_redis
    restart: unless-stopped
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  web:
    image: ${WEB_IMAGE:-videoflix-backend:prod}
    container_name: videoflix_backend
    restart: unless-stopped
    env_file: .env
    entrypoint: ["./backend.entrypoint.prod.sh"]
    environment:
      - PYTHONUNBUFFERED=1
      # Lower to 2 on low-memory hosts; the default of 3 suits most machines.
      - GUNICORN_WORKERS=${GUNICORN_WORKERS:-3}
    volumes:
      - videoflix_media:/app/media
    expose:
      - "8000"                   # reached only via Caddy, not published to the host
    healthcheck:
      # Alpine has busybox wget, not curl. ALLOWED_HOSTS in production is
      # domain-only (SITE_ADDRESS), so an unqualified request gets a Django
      # DisallowedHost 400 -- the Host header must match. start_period covers
      # migrate + collectstatic on boot before failures count against retries.
      test:
        [
          "CMD",
          "wget",
          "--spider",
          "-q",
          "--header=Host: ${SITE_ADDRESS}",
          "http://127.0.0.1:8000/api/health/",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 60s
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  # Two workers, one per queue. They must together consume every queue in
  # settings.RQ_QUEUES: an enqueue to a queue nobody pops from raises nothing,
  # the job simply never runs (video_app/tests/test_queues.py guards this).
  #
  # The image's ENTRYPOINT is the DA dev script (backend.entrypoint.sh), which
  # ignores its arguments — a bare `command:` would still boot gunicorn --reload
  # here and waste memory. Override the entrypoint so these containers run ONLY
  # their RQ worker. `web` handles migrations/collectstatic, and depends_on
  # already waits for a healthy database.
  worker:
    image: ${WEB_IMAGE:-videoflix-backend:prod}
    container_name: videoflix_worker
    restart: unless-stopped
    env_file: .env
    environment:
      - PYTHONUNBUFFERED=1
    # Fast jobs only (activation + password-reset e-mails). Deliberately does
    # NOT list 'media': a 90-minute transcode here would delay every e-mail.
    entrypoint: ["python", "manage.py", "rqworker", "default"]
    volumes:
      - videoflix_media:/app/media   # unchanged from the single-worker setup
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      web:
        # Ordering only. Nothing is built here any more (the image is pulled),
        # so this is purely "let the container that runs migrate/collectstatic
        # go first". service_started does not wait for those to finish — the
        # worker just idles on an empty queue until they do.
        condition: service_started

  media_worker:
    image: ${WEB_IMAGE:-videoflix-backend:prod}
    container_name: videoflix_media_worker
    restart: unless-stopped
    env_file: .env
    environment:
      - PYTHONUNBUFFERED=1
    # Slow jobs only (HLS transcoding). Scale with
    # `docker compose -f compose.prod.yml up -d --scale media_worker=N`
    # (drop container_name first — scaling needs generated names).
    entrypoint: ["python", "manage.py", "rqworker", "media"]
    volumes:
      - videoflix_media:/app/media   # reads source videos, writes HLS output
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      web:
        # Ordering only. Nothing is built here any more (the image is pulled),
        # so this is purely "let the container that runs migrate/collectstatic
        # go first". service_started does not wait for those to finish — the
        # worker just idles on an empty queue until they do.
        condition: service_started

volumes:
  postgres_data:
  redis_data:
  videoflix_media:
  caddy_data:
  caddy_config:
